<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b85c00">
<title>Lift Logger</title>
<!--
  Lift Logger — client. Schema v2.0.

  This file contains NO knowledge of the spreadsheet. No row numbers, no column
  letters, no exercise names, no rep schemes, no A/B rules. All of that arrives
  from GET ?action=bootstrap. Change the sheet, the app follows.

  The only thing you may need to edit here is SCRIPT_URL.
-->
<style>
  :root{
    --mango:#b85c00; --mango-lt:#fff2ce; --matcha:#2b5c10; --matcha-lt:#e8f2d8;
    --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --bg:#faf9f7;
    --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7;
    --err:#b91c1c; --err-bg:#fee2e2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    padding:16px 16px calc(104px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:520px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
  h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .prog{font-size:12px;color:var(--muted)}
  .daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .badge{
    display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;
    letter-spacing:.4px;background:var(--mango);color:#fff
  }
  .badge.b{background:var(--matcha)}
  .daymeta{font-size:12.5px;color:var(--muted)}
  .standing{
    background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;
    font-size:12.5px;font-weight:600;margin:10px 0 4px
  }

  .msg{padding:11px 13px;border-radius:8px;margin:12px 0;font-size:13.5px;font-weight:600}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.info{background:#e0f2fe;color:#075985}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg small{display:block;font-weight:500;opacity:.85;margin-top:3px;font-size:12px}
  .hide{display:none}

  .sectionlabel{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;
    color:var(--muted);margin:22px 0 9px
  }

  .card{
    position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:9px
  }
  .card.active{border-color:var(--mango);box-shadow:0 2px 12px rgba(184,92,0,.10)}
  .card.done{border-color:#bbf7d0;background:#f7fdf9}
  .card.optional .name::after{content:' · optional';font-weight:500;color:var(--muted);font-size:11.5px}
  .row1{display:flex;align-items:flex-start;gap:12px}
  .info{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px;line-height:1.25}

  /* The day number, repeated in the corner of every lift, so a card is
     self-describing even when it's the only thing on screen. */
  .daytag{
    position:absolute;top:9px;right:11px;font-size:9.5px;font-weight:800;
    letter-spacing:.7px;color:var(--muted);background:#f5f5f4;
    border-radius:5px;padding:2px 6px;pointer-events:none
  }
  .card.done .daytag{background:#e6f7ec;color:var(--ok)}
  .card.active .daytag{background:var(--mango-lt);color:var(--mango)}

  /* Current lift ─ controls sit on their own row so nothing collides with
     the corner tag, and the tap targets stay big for chalky hands. */
  .entryrow{display:flex;align-items:center;gap:9px;margin-top:11px}
  .entryrow input.w{width:100%;flex:1;font-size:19px;padding:12px 8px}
  .completebtn{
    width:100%;margin-top:11px;padding:14px;border:none;border-radius:10px;
    background:var(--matcha);color:#fff;font-size:15px;font-weight:800;
    font-family:inherit;cursor:pointer
  }
  .completebtn:active{transform:translateY(1px)}
  .completebtn:disabled{background:#a8a29e}

  /* Up next ─ compact, tappable, so a busy squat rack doesn't block you. */
  .nextrow{
    position:relative;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 62px 10px 13px;margin-bottom:7px;cursor:pointer
  }
  .nextrow .nm{font-weight:600;font-size:13.5px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nextrow .tg{font-size:11.5px;color:var(--muted);font-weight:700;flex-shrink:0}
  .nextrow .daytag{background:transparent;color:#a8a29e;top:11px;padding:0}

  /* Done ─ collapsed section, tap a row to reopen and correct it. */
  .donehead{
    display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;
    font:inherit;font-size:10.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.9px;color:var(--muted);margin:22px 0 9px;padding:0;cursor:pointer
  }
  .donehead .caret{transition:transform .15s;display:inline-block}
  .donehead.open .caret{transform:rotate(90deg)}
  .doneline{
    position:relative;display:flex;align-items:center;gap:9px;
    background:#f7fdf9;border:1px solid #bbf7d0;border-radius:10px;
    padding:9px 62px 9px 12px;margin-bottom:6px;cursor:pointer
  }
  .doneline .tick{color:var(--ok);font-weight:800;font-size:13px}
  .doneline .nm{font-weight:600;font-size:13.5px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doneline .val{font-weight:800;font-size:14px;color:var(--ok);flex-shrink:0}
  .doneline.queued{background:var(--warn-bg);border-color:#fcd34d}
  .doneline.queued .tick,.doneline.queued .val{color:var(--warn)}
  .doneline.queued .daytag{background:#fde68a;color:var(--warn)}

  .allclear{
    background:var(--ok-bg);border:1px solid #bbf7d0;border-radius:12px;
    padding:22px 16px;text-align:center;color:var(--ok);font-weight:700
  }
  .allclear .big{font-size:32px;margin-bottom:6px}
  .allclear small{display:block;font-weight:500;color:var(--muted);margin-top:5px;font-size:12.5px}
  .sub{font-size:12px;color:var(--mango);font-weight:700;margin-top:2px}
  .sub .hist{color:var(--muted);font-weight:500}
  .ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
  input.w{
    width:88px;padding:9px 6px;border:1.5px solid var(--line);border-radius:8px;
    font-size:17px;font-weight:700;text-align:center;font-family:inherit;background:#fff;color:var(--ink)
  }
  input.w:focus{outline:none;border-color:var(--mango);box-shadow:0 0 0 3px rgba(184,92,0,.12)}
  input.w.filled{border-color:var(--ok);background:#f0fdf4}
  input.w:disabled{background:var(--mango-lt);color:var(--mango);border-color:var(--mango)}
  .bw{
    font-size:11px;font-weight:800;color:var(--muted);background:#f5f5f4;
    border:1.5px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer
  }
  .bw.on{background:var(--mango-lt);color:var(--mango);border-color:var(--mango)}

  .variants{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .vchip{
    font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;
    background:#f5f5f4;border:1.5px solid var(--line);color:var(--muted)
  }
  .vchip.on{background:var(--matcha-lt);border-color:var(--matcha);color:var(--matcha)}

  .noterow{margin-top:9px}
  .notebtn{
    font-size:11.5px;font-weight:700;color:var(--muted);background:none;border:none;
    cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px
  }
  textarea.note{
    width:100%;margin-top:7px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;
    font:13px/1.4 inherit;resize:vertical;min-height:52px;background:#fff;color:var(--ink)
  }
  textarea.note:focus{outline:none;border-color:var(--mango)}

  .footer{
    position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 68%,rgba(250,249,247,0));
  }
  .footer .inner{max-width:520px;margin:0 auto}
  .footer textarea.note{margin:0 0 9px}
  .snbtn{
    display:block;margin:0 auto 8px;font-size:11.5px;font-weight:700;color:var(--muted);
    background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px
  }
  button.submit{
    width:100%;padding:16px;background:var(--mango);color:#fff;border:none;border-radius:12px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(184,92,0,.28)
  }
  button.submit:active{transform:translateY(1px)}
  button.submit:disabled{background:#a8a29e;box-shadow:none}
  .counter{text-align:center;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600}

  .loading{text-align:center;padding:56px 20px;color:var(--muted)}
  .spin{
    width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--mango);
    border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px
  }
  @keyframes s{to{transform:rotate(360deg)}}
  .retry{
    margin-top:12px;padding:9px 18px;background:var(--ink);color:#fff;border:none;
    border-radius:8px;font-size:13px;font-weight:700;cursor:pointer
  }
  .tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lift Logger</h1>
    <span class="prog" id="prog"></span>
  </header>

  <div id="msg" class="msg hide"></div>
  <div id="main"><div class="loading"><div class="spin"></div>Reading your sheet…</div></div>
</div>

<div class="footer hide" id="footer">
  <div class="inner">
    <textarea class="note hide" id="sessnote" rows="2"
      placeholder="note for the whole session — gym packed, rushed it…"
      oninput="onSessionNote(this.value)"></textarea>
    <button class="snbtn" id="snbtn" onclick="toggleSessionNote()">+ session note</button>
    <button class="submit" id="submit">Finish session</button>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════
   The only line you should ever need to change in this file.
   Re-deploy the Apps Script as a NEW VERSION and paste the /exec URL here.
   ══════════════════════════════════════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwipporTh2wPNN88kGbCL7lnuq9lB2PhlAzv70QM2xEB4DP1qYxasyGdSsy61EE5L702w/exec';

const OUTBOX_KEY = 'liftlogger.outbox.v2';
const SCHEMA     = '2.0';

/* One lift is open at a time. Completing it POSTs that single lift to the
   sheet immediately, drops it into the collapsed Done section, and swaps the
   next un-logged lift in. The endpoint already accepts a one-entry `entries`
   array, keys idempotency off request_id, and supersedes on correction — so
   per-lift writes and re-edits need no backend change. */
let state = {
  session: null, config: null, pending: [], inputs: {},
  active: null,        // exercise_id of the lift currently on screen
  doneOpen: false,     // is the Done section expanded
  sessionNote: ''
};

/* ───────────────────────────────────────────────────────────── net ─── */

async function api(path, body) {
  const url = SCRIPT_URL + (path || '') + (path && path.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
  const opts = body
    ? { method: 'POST',
        // text/plain keeps this a CORS "simple request" — Apps Script cannot
        // answer a preflight, which is why the old build was stuck on no-cors
        // and could never see whether a save succeeded.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        redirect: 'follow' }
    : { method: 'GET', redirect: 'follow' };

  const res = await fetch(url, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) {
    throw new Error(
      res.status === 401 || /accounts\.google\.com/.test(text)
        ? 'The web app is not shared publicly. Re-deploy with "Who has access: Anyone".'
        : 'The endpoint returned something that is not JSON (HTTP ' + res.status + ').');
  }
  if (!data.ok) {
    const err = new Error((data.error && data.error.message) || 'Unknown endpoint error.');
    err.code = data.error && data.error.code;
    throw err;
  }
  return data;
}

/* ──────────────────────────────────────────────────────────── boot ─── */

async function boot() {
  try {
    await flushOutbox();
    const data = await api('?action=bootstrap');
    state.config  = data.config || {};
    state.pending = data.pending || [];

    if (state.config.schema_version && state.config.schema_version !== SCHEMA) {
      show('warn', 'Schema drift',
        'The sheet says v' + state.config.schema_version + ', this app expects v' + SCHEMA +
        '. Logging is still allowed but check the Config tab.');
    }
    document.getElementById('prog').textContent = state.config.program_name || '';

    if (data.complete || !data.session) {
      document.getElementById('main').innerHTML =
        '<div class="loading"><div style="font-size:34px;margin-bottom:8px">✓</div>' +
        (data.message || 'Every session is logged.') +
        '<br><br>Open the sheet and use <b>Lift Logger ▸ Archive current cycle</b> to start fresh.</div>';
      return;
    }
    state.session = data.session;
    initInputs();
    render();
  } catch (err) {
    fatal(err);
  }
}

function fatal(err) {
  const hint = {
    SCHEMA_MISMATCH: 'Fix Config!schema_version on the sheet, or redeploy Code.gs.',
    MISSING_TAB:     'A tab was renamed or deleted. Sheet menu ▸ Lift Logger ▸ Check schema health.',
    MISSING_COLUMN:  'A row-1 header was renamed. Sheet menu ▸ Lift Logger ▸ Check schema health.',
    PROGRAM_COMPLETE:'Archive the cycle from the sheet menu.',
    BUSY:            'Another save is finishing. Wait a second and retry.'
  }[err.code] || 'If this persists, open the sheet and run Lift Logger ▸ Check schema health.';

  document.getElementById('main').innerHTML =
    '<div class="loading"><div style="font-size:30px;margin-bottom:10px">⚠</div>' +
    '<b>' + esc(err.message) + '</b><br><span style="font-size:12.5px">' + esc(hint) + '</span><br>' +
    '<button class="retry" onclick="location.reload()">Try again</button></div>';
  document.getElementById('footer').classList.add('hide');
}

/* ────────────────────────────────────────────────────────── render ─── */

/* The canonical order lifts are served in: main work, then accessories,
   each already sorted by DayPlan.sort_order server-side. */
function seq() {
  const ex = state.session.exercises;
  return ex.filter(e => e.required).concat(ex.filter(e => !e.required));
}

function isDone(id) { return !!state.inputs[id].logged; }

/** First un-logged lift in sequence, or null when the session is finished. */
function nextActive() {
  const n = seq().find(e => !isDone(e.exercise_id));
  return n ? n.exercise_id : null;
}

/** Human display string for what's currently entered — matches the sheet's. */
function displayOf(id) {
  const st = state.inputs[id];
  if (st.bw) return st.weight !== '' ? 'BW+' + st.weight : 'BW';
  return String(st.weight);
}

/* What a Done row shows. Prefers what the sheet actually holds, so legacy
   rows the app can no longer re-enter (a BW squat from when allows_bw was
   TRUE everywhere, or migration free text like "Leg press") still read
   truthfully instead of rendering blank. */
function doneDisplay(id) {
  const st = state.inputs[id];
  return st.display || displayOf(id);
}

function initInputs() {
  state.inputs = {};
  state.session.exercises.forEach(e => {
    const st = {
      bw: false, weight: '', variant: e.default_variant || '', note: '',
      logged: false, queued: false, saving: false, display: ''
    };
    if (e.already_logged) {
      // Resuming a partial session: these come back already on the sheet.
      const d = String(e.already_logged.display || '');
      st.logged  = true;
      st.display = d;
      st.note    = e.already_logged.note || '';
      st.variant = e.already_logged.variant || e.default_variant || '';
      if (/^BW/i.test(d)) {
        // A BW row on a lift that no longer accepts BW is legacy junk from
        // when allows_bw was TRUE across the board. Leave it readable in Done,
        // but don't restore an un-clearable BW onto a card with no BW button —
        // the endpoint would reject the re-submit. Reopening forces a number.
        if (e.allows_bw) {
          st.bw = true;
          st.weight = (d.indexOf('+') >= 0) ? d.split('+')[1] : '';
        }
      } else if (/^-?\d*\.?\d+$/.test(d.trim())) {
        st.weight = d.trim();
      }
      // Anything else is migration free text ("Leg press", "RO", "✓"). It
      // stays visible via st.display but never lands in a number input.
    } else if (e.bw_default && e.allows_bw) {
      st.bw = true;
    }
    state.inputs[e.exercise_id] = st;
  });
  state.active = nextActive();
}

function render() {
  const s = state.session;
  const isB = String(s.day_type).toUpperCase() !== 'A';
  let html = '';

  html += '<div class="daybar">' +
            '<span class="badge' + (isB ? ' b' : '') + '">DAY ' + s.day_num + '</span>' +
            '<span class="daymeta">' + esc(s.label) +
            (s.planned_date ? ' · ' + esc(s.planned_date) : '') + '</span>' +
          '</div>';

  if (s.is_backfill) {
    html += '<div class="msg warn">Finishing an incomplete session' +
            '<small>Day ' + s.day_num + ' was started but not filled in. Already-logged lifts are pre-filled below.</small></div>';
  }
  if (state.pending.length) {
    const list = state.pending.map(p => 'Day ' + p.day_num + ' (' + p.logged + '/' + p.planned + ')').join(', ');
    html += '<div class="msg info">Unfinished elsewhere<small>' + esc(list) +
            '. Append <code>?day=N</code> to this page\'s URL to go back and finish one.</small></div>';
  }
  if (state.config.standing_notes) {
    html += '<div class="standing">' + esc(state.config.standing_notes) + '</div>';
  }
  if (s.session_note) {
    html += '<div class="msg info">Session note<small>' + esc(s.session_note) + '</small></div>';
  }

  const list   = seq();
  const done   = list.filter(e => isDone(e.exercise_id));
  const active = state.active ? list.find(e => e.exercise_id === state.active) : null;
  const upnext = list.filter(e => !isDone(e.exercise_id) && e.exercise_id !== state.active);

  if (active) {
    html += '<div class="sectionlabel">' +
            (active.required ? 'Current lift · main work' : 'Current lift · accessory') +
            ' · ' + (done.length + 1) + ' of ' + list.length + '</div>';
    html += card(active);
  } else {
    html += '<div class="allclear"><div class="big">✓</div>Day ' + s.day_num + ' is fully logged' +
            '<small>Every lift on the plan is on the sheet. Tap Finish session below.</small></div>';
  }

  if (upnext.length) {
    html += '<div class="sectionlabel">Up next · ' + upnext.length + '</div>';
    upnext.forEach(e => html += nextRow(e));
  }

  if (done.length) {
    html += '<button class="donehead' + (state.doneOpen ? ' open' : '') + '" onclick="toggleDone()">' +
              '<span class="caret">▸</span> Done · ' + done.length +
            '</button>';
    if (state.doneOpen) done.forEach(e => html += doneLine(e));
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('footer').classList.remove('hide');

  if (active) syncCard(active.exercise_id);
  updateCounter();
}

/* ── the one open lift ── */
function card(e) {
  const id   = e.exercise_id;
  const st   = state.inputs[id];
  const last = e.last
    ? 'last ' + esc(e.last.display) + (e.last.variant ? ' · ' + esc(e.last.variant) : '') + ' (day ' + e.last.day_num + ')'
    : 'no history yet';
  const pct = (e.load_pct && e.load_pct !== 1) ? ' · ' + Math.round(e.load_pct * 100) + '%' : '';

  let h = '<div class="card active' + (e.required ? '' : ' optional') + '" id="card-' + id + '">' +
            dayTag() +
            '<div class="row1"><div class="info">' +
              '<div class="name">' + esc(e.name) + '</div>' +
              '<div class="sub">' + esc(e.target) + pct + ' <span class="hist">· ' + last + '</span></div>' +
            '</div></div>';

  if (e.variants && e.variants.length > 1) {
    h += '<div class="variants">' + e.variants.map(v =>
           '<span class="vchip" id="v-' + id + '-' + slug(v) + '" onclick="pickVariant(\'' + id + '\',\'' +
           v.replace(/'/g, "\\'") + '\')">' + esc(v) + '</span>').join('') + '</div>';
  }

  h += '<div class="entryrow">' +
         '<input class="w" id="in-' + id + '" type="number" inputmode="decimal" step="0.5" ' +
           'placeholder="' + (e.suggested ? e.suggested : 'lbs') + '" ' +
           'oninput="onWeight(\'' + id + '\',this.value)">';
  if (e.allows_bw) {
    h += '<button class="bw" id="bw-' + id + '" onclick="toggleBW(\'' + id + '\')">BW</button>';
  }
  h += '</div>';

  if (e.allows_note) {
    h += '<div class="noterow">' +
           '<button class="notebtn" onclick="toggleNote(\'' + id + '\')" id="nb-' + id + '">+ note</button>' +
           '<textarea class="note' + (st.note ? '' : ' hide') + '" id="nt-' + id + '" rows="2" ' +
             'placeholder="how it felt, form cue, pain…" ' +
             'oninput="onNote(\'' + id + '\',this.value)"></textarea>' +
         '</div>';
  }

  h += '<button class="completebtn" id="done-' + id + '" onclick="complete(\'' + id + '\')"' +
         (st.saving ? ' disabled' : '') + '>' +
         (st.saving ? 'Saving…' : 'Complete ' + esc(e.base_name || e.name)) +
       '</button>';

  return h + '</div>';
}

/* ── compact rows for lifts not yet reached; tap to jump (busy rack, etc.) ── */
function nextRow(e) {
  return '<div class="nextrow" onclick="jumpTo(\'' + e.exercise_id + '\')">' +
           dayTag() +
           '<span class="nm">' + esc(e.name) + '</span>' +
           '<span class="tg">' + esc(e.target) + '</span>' +
         '</div>';
}

/* ── a logged lift; tap to reopen and correct it (the sheet supersedes) ── */
function doneLine(e) {
  const st = state.inputs[e.exercise_id];
  return '<div class="doneline' + (st.queued ? ' queued' : '') + '" ' +
              'onclick="jumpTo(\'' + e.exercise_id + '\')">' +
           dayTag() +
           '<span class="tick">' + (st.queued ? '⏱' : '✓') + '</span>' +
           '<span class="nm">' + esc(e.name) +
             (st.variant ? ' · ' + esc(st.variant) : '') +
             (st.queued ? ' · queued offline' : '') + '</span>' +
           '<span class="val">' + esc(doneDisplay(e.exercise_id)) + '</span>' +
         '</div>';
}

function dayTag() {
  return '<span class="daytag">DAY ' + state.session.day_num + '</span>';
}

/* ──────────────────────────────────────────────────── interactions ─── */

function onWeight(id, v) { state.inputs[id].weight = v; syncCard(id); updateCounter(); }
function onNote(id, v)   { state.inputs[id].note = v; }

function onSessionNote(v) { state.sessionNote = v; }

function toggleSessionNote() {
  const ta = document.getElementById('sessnote');
  ta.classList.toggle('hide');
  if (!ta.classList.contains('hide')) ta.focus();
}

function toggleDone() { state.doneOpen = !state.doneOpen; render(); }

/** Open a specific lift — either skipping ahead, or reopening a logged one
 *  to correct it. A corrected lift is re-POSTed with a fresh request_id and
 *  the endpoint supersedes the earlier row rather than overwriting it. */
function jumpTo(id) {
  state.active = id;
  state.inputs[id].logged = false;
  state.inputs[id].queued = false;
  render();
  const inp = document.getElementById('in-' + id);
  if (inp) inp.focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleBW(id) {
  const st = state.inputs[id];
  st.bw = !st.bw;
  if (!st.bw) st.weight = '';
  syncCard(id);
  updateCounter();
}

function pickVariant(id, v) {
  state.inputs[id].variant = (state.inputs[id].variant === v) ? '' : v;
  syncCard(id);
}

function toggleNote(id) {
  const ta = document.getElementById('nt-' + id);
  ta.classList.toggle('hide');
  if (!ta.classList.contains('hide')) ta.focus();
}

function syncCard(id) {
  const st = state.inputs[id];
  const ex = state.session.exercises.find(e => e.exercise_id === id);
  const inp = document.getElementById('in-' + id);
  const bw  = document.getElementById('bw-' + id);
  if (!inp) return;

  inp.value = st.weight;
  if (bw) bw.classList.toggle('on', st.bw);

  if (st.bw) {
    inp.placeholder = '+lbs';
    inp.classList.add('filled');
  } else {
    inp.placeholder = ex && ex.suggested ? String(ex.suggested) : 'lbs';
    inp.classList.toggle('filled', st.weight !== '');
  }

  const btn = document.getElementById('done-' + id);
  if (btn) btn.disabled = st.saving || !hasValue(id);

  if (ex && ex.variants) {
    ex.variants.forEach(v => {
      const chip = document.getElementById('v-' + id + '-' + slug(v));
      if (chip) chip.classList.toggle('on', st.variant === v);
    });
  }
  const nt = document.getElementById('nt-' + id);
  if (nt && st.note && nt.value !== st.note) {
    nt.value = st.note;
    nt.classList.remove('hide');
  }
}

function hasValue(id) {
  const st = state.inputs[id];
  return st.bw || (st.weight !== '' && st.weight !== null);
}

function updateCounter() {
  const s = state.session;
  const list = seq();
  const logged = list.filter(e => isDone(e.exercise_id)).length;
  const missingRequired = list.filter(e => e.required && !isDone(e.exercise_id));
  const c = document.getElementById('counter');
  c.textContent = missingRequired.length
    ? logged + ' of ' + list.length + ' logged · still missing ' +
      missingRequired.map(e => e.base_name || e.name).join(', ')
    : logged + ' of ' + list.length + ' logged';
  document.getElementById('submit').disabled = logged === 0;
}

/* ──────────────────────────────────────────────── complete one lift ─── */

/* Each Complete is its own write. A fresh request_id per press means a
   network retry is a no-op but a genuine correction is a new row that
   supersedes the old one — you never lose what you originally entered. */
async function complete(id) {
  const s  = state.session;
  const st = state.inputs[id];
  const ex = s.exercises.find(e => e.exercise_id === id);
  if (!hasValue(id)) { show('err', 'Enter a weight, or tap BW, before completing.'); return; }
  if (st.saving) return;

  const en = { exercise_id: id };
  if (st.bw) {
    en.bw = true;
    if (st.weight !== '') en.added = Number(st.weight);
  } else {
    en.weight = Number(st.weight);
  }
  if (st.variant) en.variant = st.variant;
  if (st.note)    en.note    = st.note;

  const payload = {
    action: 'log',
    day_num: s.day_num,
    request_id: 'req_' + s.day_num + '_' + id + '_' +
                Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    entries: [en]
  };

  st.saving = true;
  syncCard(id);
  const btn = document.getElementById('done-' + id);
  if (btn) btn.textContent = 'Saving…';

  const label = (ex && (ex.base_name || ex.name)) || id;
  try {
    const res = await api('', payload);
    st.saving = false;
    st.logged = true;
    st.queued = false;
    st.display = displayOf(id);
    advance(id);
    const ss = res.session || {};
    show('ok', label + ' ' + displayOf(id) + ' saved',
      (ss.exercises_logged || 0) + ' of ' + (ss.exercises_planned || 0) + ' logged on day ' + s.day_num +
      (res.rows_superseded ? ' · earlier entry superseded, nothing deleted' : ''));
  } catch (err) {
    // Gym signal died. Park it, keep moving — the outbox replays on next load
    // and the request_id makes that replay safe.
    queue(payload);
    st.saving = false;
    st.logged = true;
    st.queued = true;
    st.display = displayOf(id);
    advance(id);
    show('warn', label + ' saved on this phone only',
      esc(err.message) + ' It sends automatically next time this page opens with a signal.');
  }
}

/** Swap the completed lift out and the next un-logged one in. */
function advance(id) {
  if (state.active === id) state.active = nextActive();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ────────────────────────────────────────────────── finish session ─── */

document.getElementById('submit').addEventListener('click', finish);

/* Lifts are already on the sheet by now. This only carries the session note
   up and moves you on to the next day. */
async function finish() {
  const s = state.session;
  const btn = document.getElementById('submit');
  const note = state.sessionNote.trim();
  btn.disabled = true;

  if (note) {
    try {
      await api('', { action: 'session_note', day_num: s.day_num, note: note });
    } catch (err) {
      show('warn', 'Session note did not send', esc(err.message) + ' Your lifts are already saved.');
      btn.disabled = false;
      return;
    }
  }
  show('ok', 'Day ' + s.day_num + ' done', 'Loading the next session…');
  setTimeout(() => location.reload(), 1200);
}

/* ───────────────────────────────────────────── offline outbox ─────── */
/* Gyms have terrible signal. A failed submit is parked here and replayed on
   the next load. The request_id makes the replay safe. */

function queue(payload) {
  try {
    const box = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]');
    box.push({ payload: payload, at: Date.now() });
    localStorage.setItem(OUTBOX_KEY, JSON.stringify(box.slice(-25)));
  } catch (e) {}
}

async function flushOutbox() {
  let box;
  try { box = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); }
  catch (e) { return; }
  if (!box.length) return;

  const left = [];
  let sent = 0;
  for (const item of box) {
    try { await api('', item.payload); sent++; }
    catch (e) { left.push(item); }
  }
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(left)); } catch (e) {}
  if (sent) show('ok', 'Sent ' + sent + ' queued session' + (sent === 1 ? '' : 's') + ' from offline storage.');
}

/* ──────────────────────────────────────────────────────────── util ─── */

function show(kind, title, detail) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + kind;
  el.innerHTML = esc(title) + (detail ? '<small>' + detail + '</small>' : '');
  el.classList.remove('hide');
  if (kind === 'ok') setTimeout(() => el.classList.add('hide'), 6000);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function slug(s) { return String(s).replace(/\W+/g, '_').toLowerCase(); }

/* ?day=7 forces a specific session (used to finish a missed day). */
const forced = new URLSearchParams(location.search).get('day');
(async function () {
  if (forced) {
    try {
      await flushOutbox();
      const data = await api('?action=bootstrap&day=' + encodeURIComponent(forced));
      state.config = data.config || {}; state.pending = data.pending || [];
      document.getElementById('prog').textContent = state.config.program_name || '';
      if (!data.session) { fatal(new Error('Day ' + forced + ' has no session row.')); return; }
      state.session = data.session;
      initInputs();
      render();
      show('info', 'Editing day ' + forced + ' directly', 'Remove ?day= from the URL to return to the next session.');
    } catch (e) { fatal(e); }
  } else {
    boot();
  }
})();
</script>
</body>
